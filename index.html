<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Autorização de Trabalho e Acesso</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#00938E"
    >

</head>


<body>


    <!-- =========================
         LOGIN
         ========================= -->

    <div class="login-container">

        <img
            src="logo-light.png"
            alt="Light - Prontos e Energizados"
            class="logo-light"
        >

        <h1>
            Autorização de Trabalho e Acesso
        </h1>


        <div class="campo">

            <label for="matricula">
                Matrícula
            </label>

            <input
                type="text"
                id="matricula"
                placeholder="Digite sua matrícula"
            >

        </div>


        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >

        </div>


        <button onclick="entrar()">
            ENTRAR
        </button>

    </div>



    <!-- =========================
         DOCUMENTO
         ========================= -->

    <div
        class="documento-container"
        style="display: none;"
    >

    </div>



    <!-- =========================
         CADASTRO DOS FUNCIONÁRIOS
         ========================= -->

    <script>

        const colaboradores = {

            "4013571": {
                nome: "LUCIANO JESUS DE SOUZA",
                cargo: "ELETRICISTA DA DISTRIBUICAO JR",
                nr10: "20/10/2027",
                nr33: "-",
                nr35: "11/11/2027",
                senha: "1234"
            },

            "4013001": {
                nome: "JOÃO JOÃO",
                cargo: "ELETRICISTA DA DISTRIBUICAO JR",
                nr10: "21/10/2027",
                nr33: "-",
                nr35: "12/11/2027",
                senha: "1234"
            },

            "4013002": {
                nome: "PEDRO PEDRO",
                cargo: "ELETRICISTA DA DISTRIBUICAO JR",
                nr10: "22/10/2027",
                nr33: "-",
                nr35: "13/11/2027",
                senha: "1234"
            },

            "4013003": {
                nome: "PAULO PAULO",
                cargo: "ELETRICISTA DA DISTRIBUICAO JR",
                nr10: "23/10/2027",
                nr33: "-",
                nr35: "14/11/2027",
                senha: "1234"
            }

        };


        let colaboradorLogado = null;

        let matriculaLogada = null;



        /* =========================
           ENTRAR
           ========================= */

        function entrar() {

            const matricula =
                document
                    .getElementById("matricula")
                    .value
                    .trim();

            const senha =
                document
                    .getElementById("senha")
                    .value
                    .trim();

            const colaborador =
                colaboradores[matricula];


            if (!colaborador) {

                alert(
                    "Matrícula não encontrada."
                );

                return;
            }


            if (colaborador.senha !== senha) {

                alert(
                    "Senha inválida."
                );

                return;
            }


            colaboradorLogado =
                colaborador;

            matriculaLogada =
                matricula;


            document
                .querySelector(".login-container")
                .style.display = "none";


            document
                .querySelector(".documento-container")
                .style.display = "block";


            mostrarFrente();

        }



        /* =========================
           FRENTE
           ========================= */

        function mostrarFrente() {

            document
                .querySelector(".documento-container")
                .innerHTML = `

                    <h3 class="nome-colaborador">
                        Olá, ${colaboradorLogado.nome}
                    </h3>

                    <h2>
                        Autorização de Trabalho e Acesso
                    </h2>

                    <img
                        src="frente.png"
                        alt="Frente da Autorização de Trabalho e Acesso"
                        class="documento-imagem"
                    >

                    <button onclick="verVerso()">
                        VER VERSO
                    </button>

                `;

        }



        /* =========================
           VERSO
           ========================= */

        function verVerso() {

            document
                .querySelector(".documento-container")
                .innerHTML = `

                    <h3 class="nome-colaborador">
                        Olá, ${colaboradorLogado.nome}
                    </h3>

                    <h2>
                        Autorização de Trabalho e Acesso
                    </h2>

                    <img
                        src="verso.png"
                        alt="Verso da Autorização de Trabalho e Acesso"
                        class="documento-imagem"
                    >

                    <button onclick="mostrarFrente()">
                        VOLTAR
                    </button>

                `;

        }



        /* =========================
           ENTER PELO TECLADO
           ========================= */

        document
            .getElementById("senha")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        entrar();

                    }

                }
            );

    </script>


</body>

</html>
